# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Create key.json
      run: |
        cd src/cacheServer
        echo "$GOOGLE_KEY_JSON" > key.json
      env:
        GOOGLE_KEY_JSON: ${{ secrets.GOOGLE_KEY_JSON }}

    - name: Build
      run: |
        cd src
        go build -v ./...

    - name: Test
      run: |
        cd src/cacheServer
        go test -v $(go list ./... | grep -v '/server')
